services:
  - type: web
    name: zero-trust-relay
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 app.server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
